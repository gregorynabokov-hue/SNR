# Настройки деплоя прокси на Cloudflare Workers.
# Перед деплоем замените REPLACE_WITH_MODEL на название модели из кабинета Coarena.
# Ключ НЕ записывается сюда: он задаётся командой `npx wrangler secret put OPENAI_API_KEY`.
name = "snr-os-scenario"
main = "worker.js"
compatibility_date = "2024-09-01"

[vars]
ALLOWED_ORIGIN = "https://gregorynabokov-hue.github.io"
LLM_BASE_URL = "https://coarena.ai/api/v1"
LLM_MODEL = "REPLACE_WITH_MODEL"
